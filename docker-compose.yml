# Task Manager backend.
# PR 2 adds Postgres so the users migration can be applied.
# The app itself still only serves /health; auth comes in PR 3.
services:
  app:
    build: .
    environment:
      HTTP_PORT: "8080"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-taskmanager}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-taskmanager}"
      POSTGRES_DB: "${POSTGRES_DB:-taskmanager}"
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
